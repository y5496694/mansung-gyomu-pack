<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>학교 기본 시간표</title>
<style>
:root{--ink:#172a36;--muted:#63717c;--blue:#215b92;--blue-soft:#eaf2fa;--line:#dce3e8;--paper:#fff;--bg:#f3f5f7}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;font-size:14px;line-height:1.55}button,select{font:inherit}button{cursor:pointer}button:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #75a9e6;outline-offset:3px}button:disabled{cursor:wait;opacity:.6}.top{background:#fff;border-bottom:1px solid var(--line)}.top-inner{max-width:1400px;margin:auto;padding:22px 32px;display:flex;justify-content:space-between;gap:24px;align-items:center}.brand{display:flex;gap:13px;align-items:center}.mark{width:42px;height:42px;display:grid;place-items:center;background:var(--blue);border-radius:12px;color:white}.mark svg{width:25px;height:25px}.eyebrow{font-size:12px;color:var(--muted);letter-spacing:.03em}h1{font-size:21px;margin:0;font-weight:750;letter-spacing:-.04em}.top-actions{display:flex;gap:12px;align-items:center}.term{font-size:13px;padding:6px 12px;border-radius:20px;background:var(--blue-soft);color:var(--blue);font-weight:700}.primary{background:var(--blue);color:#fff;border:0;border-radius:8px;padding:10px 15px;font-weight:700}.quiet{border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 12px;color:var(--ink)}main{max-width:1400px;margin:auto;padding:30px 32px}.intro{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:22px}.intro h2{font-size:27px;letter-spacing:-.05em;margin:0 0 5px}.intro p{margin:0;color:var(--muted)}.checked{text-align:right;font-size:12px;color:var(--muted);white-space:nowrap}.status{margin-bottom:20px;border:1px solid #ead7a5;background:#fff9e9;color:#73531c;padding:13px 16px;border-radius:10px}.status.error{border-color:#efc3bc;background:#fff2ef;color:#903a2a}.status[hidden]{display:none}.workspace{display:grid;grid-template-columns:210px minmax(0,1fr);gap:24px}.sidebar{align-self:start;background:#fff;border:1px solid var(--line);padding:20px 14px;border-radius:14px}.sidebar h3{font-size:12px;color:var(--muted);margin:0 10px 12px}.grades{display:grid;gap:6px}.grade{display:flex;align-items:center;justify-content:space-between;text-align:left;padding:12px 13px;border:0;border-radius:8px;background:transparent;color:var(--ink);font-weight:650}.grade small{font-size:11px;font-weight:400;color:var(--muted)}.grade.active{background:var(--blue-soft);color:var(--blue)}.sidebar-note{padding:18px 10px 0;border-top:1px solid var(--line);margin-top:20px;color:var(--muted);font-size:12px}.sidebar-note strong{display:block;color:var(--ink);font-size:17px;margin-bottom:3px}.content{min-width:0}.class-select{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:18px}.class-select button{padding:9px 22px;border:1px solid var(--line);background:#fff;border-radius:8px;color:var(--muted);font-weight:650}.class-select button.active{border-color:var(--blue);color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue);background:var(--blue-soft)}.card{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}.card-head{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:21px 24px;border-bottom:1px solid var(--line)}.card-head h3{font-size:20px;margin:0;letter-spacing:-.03em}.card-head span{font-size:12px;color:var(--muted)}.table-wrap{overflow-x:auto}table{border-collapse:collapse;width:100%;table-layout:fixed;min-width:570px}th{padding:15px 8px;color:var(--muted);font-size:12px;font-weight:600;background:#fcfdfe;border-bottom:1px solid var(--line)}th:first-child{width:68px}td{height:83px;padding:12px 8px;text-align:center;border-right:1px solid #edf0f3;border-bottom:1px solid #edf0f3;overflow-wrap:anywhere}td:last-child{border-right:0}tr:last-child td{border-bottom:0}td.period{font-size:12px;color:var(--muted);background:#fcfdfe}th.today{color:var(--blue);background:#edf4fc}td.today{background:#f7faff}.subject{font-size:16px;font-weight:700;letter-spacing:-.03em}.detail{font-size:11px;color:var(--muted);margin-top:3px}.empty{color:#aab3bb;font-weight:400}.tag{display:inline-block;font-size:11px;background:#eef4ed;color:#4d6949;border-radius:4px;padding:2px 7px;margin-top:4px}.summary{margin-top:18px;padding:19px 24px;display:flex;align-items:flex-start;gap:18px;flex-wrap:wrap}.summary h3{font-size:12px;color:var(--muted);font-weight:500;margin:4px 0}.counts{display:flex;gap:8px;flex-wrap:wrap}.count{padding:5px 10px;border:1px solid var(--line);border-radius:6px;font-size:12px}.count b{margin-left:6px;color:var(--blue)}footer{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;color:var(--muted);font-size:11px;margin-top:20px}.legend{font-size:11px;color:var(--muted);padding:12px 24px;border-top:1px solid var(--line);background:#fcfdfe}#empty-state{padding:50px;text-align:center;color:var(--muted)}.busy-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#5b8a64;margin-right:6px}.print{font-size:12px}a{color:var(--blue)}
@media(max-width:800px){.top-inner{padding:16px 18px}.top-actions{gap:8px}.term{font-size:11px}.primary{padding:9px 12px;font-size:12px}main{padding:22px 16px}.intro h2{font-size:23px}.intro{align-items:start;flex-direction:column}.checked{text-align:left}.workspace{grid-template-columns:1fr;gap:16px}.sidebar{padding:12px;border-radius:10px}.sidebar h3,.sidebar-note{display:none}.grades{display:flex;overflow-x:auto;gap:4px}.grade{padding:9px 13px;white-space:nowrap;gap:8px}.grade small{display:none}.class-select button{padding:8px 18px}.card-head{padding:17px 18px}.card-head h3{font-size:18px}.summary{padding:16px 18px}.subject{font-size:14px}td{height:78px}.print{display:none}}
@media print{body{background:white}.top-actions,.sidebar,.class-select,.status,.print{display:none!important}.workspace{display:block}main{padding:16px}.top-inner{padding:12px 16px}.card{break-inside:avoid}.checked{text-align:left}.intro h2{font-size:21px}td{height:68px}.summary{display:none}}
.count{background:#fff;color:var(--ink);font:inherit;font-size:12px;cursor:pointer}.count.active{border-color:#b88a21;background:#fff1c2;color:#624800;box-shadow:inset 0 0 0 1px #b88a21}.count.active b{color:#624800}td.highlight,td.today.highlight{background:#fff1c2;box-shadow:inset 0 0 0 2px #d0a13b}.summary .hint{display:block;font-size:11px;margin-top:3px}.clear-highlights{font-size:11px;padding:5px 10px;margin-left:auto}.clear-highlights[hidden]{display:none}
</style>
</head>
<body>
<header class="top"><div class="top-inner"><div class="brand"><div class="mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M7 2v5M17 2v5M3 10h18M8 14h2m4 0h2m-8 4h2m4 0h2"/></svg></div><div><div class="eyebrow" id="school">학교 시간표</div><h1>기본 시간표</h1></div></div><div class="top-actions"><span class="term" id="term">학기 확인 중</span><button class="primary" id="refresh">원본 새로고침</button></div></div></header>
<main>
<section class="intro"><div><h2>우리 반의 한 주</h2><p id="intro-note">학년과 반을 선택해 시간표를 확인하세요.</p></div><div class="checked"><div id="mode"></div><div id="checked"></div></div></section>
<div class="status" id="status" role="status" aria-live="polite" hidden></div>
<div class="workspace"><aside class="sidebar"><h3>학년 선택</h3><nav class="grades" id="grades" aria-label="학년"></nav><div class="sidebar-note"><strong id="class-total"></strong><span>원본에서 확인한 학급</span><p>빈칸은 원본 미기재입니다.<br>학교의 기본 시간표를 보여줍니다.</p></div></aside><section class="content"><nav class="class-select" id="classes" aria-label="반"></nav><div class="card" id="schedule"><div class="card-head"><h3 id="class-title">시간표를 준비하고 있습니다</h3><div><span id="weekly-total"></span> <button class="quiet print" id="print">인쇄</button></div></div><div class="table-wrap" id="table"></div><div class="legend">— 원본 빈칸 · ? 미확인 · 과목 아래에는 원본에 적힌 장소 등 부가정보를 표시합니다.</div></div><div id="empty-state" hidden>저장된 시간표가 없습니다. 에이전트에게 시간표 조사를 요청해 주세요.</div><div class="card summary" id="summary"><h3>주간 과목별 시수</h3><div class="counts" id="counts"></div></div></section></div>
<footer><span>기본 시간표 기준 · 날짜별 행사와 임시 변경은 별도로 확인해 주세요.</span><span id="as-of"></span></footer>
</main>
<script type="application/json" id="initial-data">__TIMETABLE_JSON__</script>
<script>
'use strict';
let data=JSON.parse(document.getElementById('initial-data').textContent),grade=null,className=null,busy=false,lastDate='';
const selectedSubjects=new Set();
const online=['http:','https:'].includes(location.protocol),$=id=>document.getElementById(id);
function node(tag,text,cls){const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n}
const clearButton=node('button','강조 해제','quiet clear-highlights');clearButton.type='button';clearButton.hidden=true;$('summary').append(clearButton);
$('summary').querySelector('h3').append(node('span','과목을 누르면 시간표에서 강조됩니다.','hint'));
function updateHighlights(){document.querySelectorAll('td[data-subject]').forEach(td=>td.classList.toggle('highlight',selectedSubjects.has(td.dataset.subject)));document.querySelectorAll('#counts button').forEach(b=>{const active=selectedSubjects.has(b.dataset.subject);b.classList.toggle('active',active);b.setAttribute('aria-pressed',String(active))});clearButton.hidden=selectedSubjects.size===0}
clearButton.onclick=()=>{selectedSubjects.clear();updateHighlights()};
function seoulDate(){return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date())}
function termFor(date){const [y,m]=date.split('-').map(Number);return [m===1?y-1:y,m>=2&&m<=7?1:2]}
function setStatus(text,error=false){$('status').hidden=!text;$('status').textContent=text;$('status').className='status'+(error?' error':'')}
function termWarning(){if(!data)return '';const [y,s]=termFor(seoulDate());return data.academic_year!==y||data.semester!==s?`현재는 ${y}학년도 ${s}학기입니다. 아래에는 마지막으로 저장된 ${data.academic_year}학년도 ${data.semester}학기 자료가 표시됩니다.`:''}
function render(){
 if(!data){$('empty-state').hidden=false;$('schedule').hidden=true;$('summary').hidden=true;return}
 $('empty-state').hidden=true;$('schedule').hidden=false;$('summary').hidden=false;
 document.title=`${data.school_name} 기본 시간표`;$('school').textContent=data.school_name;$('term').textContent=`${data.academic_year}학년도 ${data.semester}학기`;
 const grades=[...new Set(data.classes.map(c=>c.grade))];if(!grades.includes(grade))grade=grades[0];
 const classes=data.classes.filter(c=>c.grade===grade);if(!classes.some(c=>c.class===className))className=classes[0]?.class;
 $('grades').replaceChildren(...grades.map(g=>{const b=node('button',undefined,'grade'+(g===grade?' active':''));b.append(node('span',`${g}학년`),node('small',`${data.classes.filter(c=>c.grade===g).length}개 반`));b.setAttribute('aria-pressed',g===grade);b.onclick=()=>{grade=g;className=null;render()};return b}));
 $('classes').replaceChildren(...classes.map(c=>{const b=node('button',`${c.class}반`,c.class===className?'active':'');b.setAttribute('aria-pressed',c.class===className);b.onclick=()=>{className=c.class;render()};return b}));
 $('class-total').textContent=`${grades.length}개 학년 · ${data.classes.length}개 반`;
 $('checked').textContent=`원본 확인 ${new Intl.DateTimeFormat('ko-KR',{timeZone:'Asia/Seoul',month:'long',day:'numeric',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).format(new Date(data.fetched_at))}`;
 $('as-of').textContent=`조회 기준 ${data.as_of} · 한국 시간`;
 const c=classes.find(c=>c.class===className);if(!c)return;$('class-title').textContent=c.label;
 const counts={};Object.values(c.days).flat().filter(s=>s.status==='lesson').forEach(s=>counts[s.subject]=(counts[s.subject]||0)+1);
 const total=Object.values(counts).reduce((a,b)=>a+b,0);$('weekly-total').textContent=`주 ${total}시간`;
 $('counts').replaceChildren(...Object.entries(counts).sort((a,b)=>b[1]-a[1]).map(([s,n])=>{const el=node('button',undefined,'count');el.type='button';el.dataset.subject=s;el.append(document.createTextNode(s),node('b',n));el.onclick=()=>{if(selectedSubjects.has(s))selectedSubjects.delete(s);else selectedSubjects.add(s);updateHighlights()};return el}));
 const weekday=new Intl.DateTimeFormat('ko-KR',{timeZone:'Asia/Seoul',weekday:'short'}).format(new Date());
 const table=node('table'),head=node('thead'),hr=node('tr');hr.append(node('th','교시'));data.weekdays.forEach(d=>{const th=node('th',`${d}요일`,d===weekday?'today':'');th.scope='col';hr.append(th)});head.append(hr);table.append(head);const body=node('tbody');
 data.periods.forEach(p=>{const tr=node('tr');tr.append(node('td',`${p}교시`,'period'));data.weekdays.forEach(d=>{const td=node('td',undefined,d===weekday?'today':'');const s=c.days[d].find(s=>s.period===p);if(s?.status==='lesson'){td.dataset.subject=s.subject;td.append(node('div',s.subject,'subject'));if(s.detail)td.append(node('div',s.detail,'detail'));td.title=`원본 ${s.source.sheet}!${s.source.cell} · ${s.raw}`}else{td.append(node('span',s?.status==='unmapped'?'?':'—','empty'));td.title=s?.status==='unmapped'?'미확인 교시':'원본 빈칸'}tr.append(td)});body.append(tr)});table.append(body);$('table').replaceChildren(table);updateHighlights();
}
async function refresh(){if(busy||!online)return;busy=true;$('refresh').disabled=true;$('refresh').textContent='확인 중…';
 try{const response=await fetch('/api/refresh',{method:'POST',headers:{'X-Timetable':'1'}});const result=await response.json();if(!response.ok||!result.ok)throw Error(result.error||'원본 확인에 실패했습니다.');data=result.data;render();setStatus(termWarning(),!!termWarning());$('mode').textContent='원본과 연결됨 · 5분마다 자동 확인'}catch(e){setStatus((termWarning()?termWarning()+' ':'')+`갱신하지 못했습니다. ${e.message} 마지막 확인 시각을 확인해 주세요.`,true)}
 finally{busy=false;$('refresh').disabled=false;$('refresh').textContent='원본 새로고침'}
}
async function poll(){if(!online||busy)return;try{const [r,s]=await Promise.all([fetch('/api/timetable'),fetch('/api/status')]);if(r.ok){const fresh=await r.json();if(!data||fresh.generated_at!==data.generated_at||fresh.source_hash!==data.source_hash||fresh.as_of!==data.as_of||fresh.semester!==data.semester||fresh.academic_year!==data.academic_year){data=fresh;render()}}if(s.ok){const status=await s.json();if(!status.ok)setStatus((termWarning()?termWarning()+' ':'')+`최근 원본 확인 실패: ${status.error} 마지막으로 저장된 자료가 표시됩니다.`,true);else if(!busy)setStatus(termWarning(),!!termWarning())}}catch(e){setStatus('자동 갱신 연결이 끊겼습니다. 시간표 열기를 다시 실행해 주세요. 저장된 자료가 표시됩니다.',true)}}
$('refresh').onclick=refresh;$('print').onclick=()=>window.print();render();lastDate=seoulDate();
if(online){$('mode').textContent='원본 연결 확인 중';refresh();setInterval(poll,10000);setInterval(refresh,300000);setInterval(()=>{if(lastDate!==seoulDate()){lastDate=seoulDate();refresh()}},30000);document.addEventListener('visibilitychange',()=>{if(!document.hidden){poll();if(lastDate!==seoulDate()){lastDate=seoulDate();refresh()}}})}
else{$('refresh').hidden=true;$('mode').textContent='저장된 사본';setStatus((termWarning()?termWarning()+' ':'')+'저장된 사본입니다. 원본 자동 갱신은 폴더의 ‘시간표 열기.cmd’를 실행해 이용하세요.',!!termWarning())}
</script>
</body></html>
