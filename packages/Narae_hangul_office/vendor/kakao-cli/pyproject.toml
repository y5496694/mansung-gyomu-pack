[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kakaocli-win"
version = "0.6.2"
description = "A safety-first, unofficial KakaoTalk CLI for Windows"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["pywin32>=306", "numpy>=1.26", "cryptography>=42", "Pillow>=10"]

[project.scripts]
kakaocli = "kakaocli_win.cli:main"
kakao = "kakaocli_win.cli:main"

[project.optional-dependencies]
test = ["pytest>=8"]
analysis = ["Pillow>=10", "pypdf>=5", "PyMuPDF>=1.24,<2", "openpyxl>=3.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kakaocli_win = ["*.js", "*.mjs", "*.ps1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

