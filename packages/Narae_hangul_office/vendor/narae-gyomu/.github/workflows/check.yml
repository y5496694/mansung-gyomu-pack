name: Verify integration and frozen sources
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - shell: pwsh
        run: New-Item -ItemType Directory -Path D:\Codex\tmp -Force
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm run vendor:verify
