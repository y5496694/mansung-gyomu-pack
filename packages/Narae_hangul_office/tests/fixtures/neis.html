<!doctype html><meta charset="utf-8"><title>합성 나이스</title><div id="root"></div><script>
let state={category:'연가',type:'연가',date:'',start:'',end:'',reason:'',route:false,sent:false};window.fixture=state;
const root=document.getElementById('root');
function notice(){root.innerHTML='<div role="dialog" aria-label="공지사항"><h2>공지사항</h2><p>합성 안내</p><button onclick="menu()">닫기</button></div>'}
function menu(){root.innerHTML='<div role="treeitem" tabindex="0" onclick="manage()">복무</div>'}
function manage(){root.innerHTML='<div role="tab" tabindex="0" onclick="list()">개인근무상황관리</div>'}
function list(){root.innerHTML='<h1>개인근무상황관리</h1><button onclick="renderForm()">신청</button>'}
function renderForm(){root.innerHTML='<div role="dialog" aria-label="근무상황신청"><h2>근무상황신청</h2><span>근무상황대분류 연가</span><div role="combobox" aria-label="근무상황소분류" tabindex="0" onclick="document.getElementById(&quot;options&quot;).hidden=false">'+state.type+'</div><div role="listbox" id="options" hidden><div role="option" onclick="state.type=&quot;조퇴&quot;;renderForm()">조퇴</div></div>'+['date','start','end','reason'].map((key,i)=>'<label>'+['신청일자','시작시각','종료시각','사유'][i]+'<input value="'+state[key]+'" onchange="state.'+key+'=this.value"></label>').join('')+'<button onclick="prepare()">승인요청</button></div>'}
function prepare(){document.activeElement.blur();root.innerHTML='<div role="dialog" aria-label="기안문서상신"><h2>기안문서상신</h2><p>기안내용 '+state.type+' '+state.date+' '+state.start+' ~ '+state.end+' '+state.reason+'</p><button onclick="routes()">개인결재선</button><button onclick="state.sent=true">상신</button></div>'}
function routes(){root.innerHTML='<div role="dialog" aria-label="개인 결재선 지정"><h2>개인 결재선 지정</h2><div role="option" tabindex="0" onclick="state.route=true;selected()">합성학교 검토자A → 결재자B 조퇴 경로</div></div>'}
function selected(){root.innerHTML='<div role="dialog" aria-label="개인 결재선 지정"><p>합성학교 검토자A 검토 → 결재자B 결재</p><button onclick="done()">지정</button></div>'}
function done(){root.innerHTML='<div role="dialog" aria-label="기안문서상신"><h2>기안문서상신</h2><p>기안내용 '+state.type+' '+state.date+' '+state.start+' ~ '+state.end+' '+state.reason+'</p><table><tr><td>1 검토자A 합성학교 검토</td></tr><tr><td>2 결재자B 합성학교 결재</td></tr></table><p>미상신 · 별도 임시저장 없음</p><button onclick="state.sent=true">상신</button></div>'}
notice();</script>
