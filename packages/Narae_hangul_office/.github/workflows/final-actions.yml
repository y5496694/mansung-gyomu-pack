name: Authorized school actions
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  final-actions:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci --ignore-scripts --no-audit --no-fund
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: node --test --test-concurrency=1 tests/school-final-task.test.cjs tests/final-actions.test.cjs tests/neis.test.cjs
